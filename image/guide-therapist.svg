<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="thBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8dfd0"/>
      <stop offset="55%" stop-color="#d8efe4"/>
      <stop offset="100%" stop-color="#e4e9ff"/>
    </linearGradient>
    <radialGradient id="thGlow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8754a"/>
      <stop offset="100%" stop-color="#a8542a"/>
    </linearGradient>
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe1cd"/>
      <stop offset="100%" stop-color="#ffd6b8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#thBg)"/>
  <ellipse cx="200" cy="135" rx="190" ry="125" fill="url(#thGlow)"/>

  <!-- Decorative dots -->
  <circle cx="40" cy="40" r="3" fill="#fff" opacity="0.7"/>
  <circle cx="65" cy="65" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="360" cy="45" r="3" fill="#fff" opacity="0.7"/>
  <circle cx="338" cy="75" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="50" cy="215" r="2.5" fill="#fff" opacity="0.7"/>
  <circle cx="355" cy="220" r="3" fill="#fff" opacity="0.7"/>

  <!-- Sparkles -->
  <g fill="#fff" opacity="0.95">
    <path d="M95 55 l1.5 -5 l1.5 5 l5 1.5 l-5 1.5 l-1.5 5 l-1.5 -5 l-5 -1.5 z"/>
    <path d="M300 55 l1.5 -5 l1.5 5 l5 1.5 l-5 1.5 l-1.5 5 l-1.5 -5 l-5 -1.5 z"/>
  </g>

  <!-- Floor line -->
  <line x1="40" y1="215" x2="360" y2="215" stroke="#7ab092" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <!-- Floor shadow -->
  <ellipse cx="200" cy="218" rx="155" ry="6" fill="#000" opacity="0.06"/>

  <!-- LEFT armchair (smaller - child's chair) -->
  <g transform="translate(85, 165)">
    <!-- Chair back -->
    <path d="M-32 -50 Q -38 -50, -38 -42 L -38 0 L 32 0 L 32 -42 Q 32 -50, 26 -50 Z"
          fill="url(#chairGrad)" stroke="#a8542a" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Cushion -->
    <ellipse cx="0" cy="-2" rx="34" ry="6" fill="#ff9a5a" stroke="#a8542a" stroke-width="2"/>
    <!-- Seat -->
    <path d="M-36 0 L 36 0 L 32 25 L -32 25 Z"
          fill="#ffd6b8" stroke="#a8542a" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Legs -->
    <line x1="-28" y1="25" x2="-30" y2="42" stroke="#a8542a" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="25" x2="30" y2="42" stroke="#a8542a" stroke-width="3" stroke-linecap="round"/>
    <!-- Heart on backrest -->
    <path d="M0 -32
             C -6 -38, -14 -34, -14 -28
             C -14 -22, 0 -14, 0 -14
             C 0 -14, 14 -22, 14 -28
             C 14 -34, 6 -38, 0 -32 Z"
          fill="#ff9a5a" stroke="#a8542a" stroke-width="2"/>
  </g>

  <!-- RIGHT armchair (larger - therapist's chair) -->
  <g transform="translate(310, 160)">
    <!-- Chair back -->
    <path d="M-38 -60 Q -45 -60, -45 -50 L -45 0 L 38 0 L 38 -50 Q 38 -60, 31 -60 Z"
          fill="url(#chairGrad)" stroke="#a8542a" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Cushion -->
    <ellipse cx="0" cy="-2" rx="41" ry="7" fill="#5e7bff" stroke="#3241b7" stroke-width="2"/>
    <!-- Seat -->
    <path d="M-43 0 L 43 0 L 39 30 L -39 30 Z"
          fill="#ffd6b8" stroke="#a8542a" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Legs -->
    <line x1="-34" y1="30" x2="-36" y2="48" stroke="#a8542a" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="30" x2="36" y2="48" stroke="#a8542a" stroke-width="3" stroke-linecap="round"/>
    <!-- Heart on backrest -->
    <path d="M0 -38
             C -7 -45, -16 -40, -16 -33
             C -16 -26, 0 -16, 0 -16
             C 0 -16, 16 -26, 16 -33
             C 16 -40, 7 -45, 0 -38 Z"
          fill="#5e7bff" stroke="#3241b7" stroke-width="2"/>
  </g>

  <!-- Plant between chairs -->
  <g transform="translate(200, 175)">
    <!-- Pot -->
    <path d="M-22 0 L 22 0 L 18 30 L -18 30 Z"
          fill="url(#potGrad)" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
    <!-- Pot rim -->
    <rect x="-25" y="-4" width="50" height="6" rx="1.5" fill="#c8754a" stroke="#1f2933" stroke-width="2"/>

    <!-- Leaves -->
    <g stroke="#5b8c70" stroke-width="2.5" stroke-linecap="round" fill="#9bc2a8">
      <!-- Center stem -->
      <path d="M0 -4 L 0 -45" fill="none"/>
      <!-- Left big leaf -->
      <path d="M-2 -25 Q -25 -28, -28 -45 Q -18 -50, -3 -32 Z"/>
      <!-- Right big leaf -->
      <path d="M2 -25 Q 25 -28, 28 -45 Q 18 -50, 3 -32 Z"/>
      <!-- Left small leaf -->
      <path d="M-2 -15 Q -18 -18, -20 -30 Q -12 -32, -3 -22 Z"/>
      <!-- Right small leaf -->
      <path d="M2 -15 Q 18 -18, 20 -30 Q 12 -32, 3 -22 Z"/>
      <!-- Top leaf -->
      <path d="M0 -45 Q -6 -55, 0 -62 Q 6 -55, 0 -45 Z"/>
    </g>
  </g>

  <!-- Conversation hearts floating between chairs -->
  <g>
    <!-- Small heart 1 -->
    <g transform="translate(155, 100)">
      <path d="M0 5
               C -8 -3, -16 0, -16 -7
               C -16 -13, -8 -16, 0 -8
               C 0 -8, 8 -16, 16 -13
               C 16 0, 8 -3, 0 5 Z"
            fill="#ff9a5a" stroke="#a8542a" stroke-width="1.8"/>
    </g>
    <!-- Small heart 2 -->
    <g transform="translate(245, 85)">
      <path d="M0 4
               C -6 -2, -12 0, -12 -5
               C -12 -10, -6 -12, 0 -6
               C 0 -6, 6 -12, 12 -10
               C 12 0, 6 -2, 0 4 Z"
            fill="#5e7bff" stroke="#3241b7" stroke-width="1.5"/>
    </g>
    <!-- Tiny heart center -->
    <g transform="translate(200, 70)">
      <path d="M0 3
               C -5 -2, -10 0, -10 -4
               C -10 -8, -5 -10, 0 -5
               C 0 -5, 5 -10, 10 -8
               C 10 0, 5 -2, 0 3 Z"
            fill="#fff" stroke="#7ab092" stroke-width="1.5"/>
    </g>
  </g>
</svg>
